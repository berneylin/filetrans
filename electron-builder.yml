appId: com.filetrans.app
productName: FileTrans
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asar: true
npmRebuild: true
linux:
  target:
    - AppImage
    - deb
  category: Network
  maintainer: FileTrans <filetrans@example.com>
  synopsis: SSH/SFTP 双栏文件传输客户端
  syncDesktopName: true
mac:
  target:
    - dmg
  category: public.app-category.utilities
